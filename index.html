<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI R/P 중간 점검 보고</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #17191f; --muted: #5d6270; --faint: #8b909c; --line: #e3e3de; --soft: #f0f0ec;
  --a: #e0571f; --a-soft: #fde9df; --b: #2f63d8; --b-soft: #e3ebfb; --a0: #9aa0ab; --ok: #1a8a5a; --warn: #b7791f; --bad: #c8382f;
  --radius: 14px; --shadow: 0 1px 2px rgba(20,22,30,.04), 0 6px 18px -12px rgba(20,22,30,.18);
  --serif: "Iowan Old Style", "Apple Garamond", "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
  --sans: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --panel: #1c1f26; --ink: #eceef2; --muted: #a6abb6; --faint: #7d8390; --line: #2c3039; --soft: #23262e;
    --a: #ff7a43; --a-soft: #3a2419; --b: #6f98ff; --b-soft: #1d2a45; --a0: #7d8390; --ok: #42c48a; --warn: #e2a64a; --bad: #ff6b60;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161b; --panel: #1c1f26; --ink: #eceef2; --muted: #a6abb6; --faint: #7d8390; --line: #2c3039; --soft: #23262e;
  --a: #ff7a43; --a-soft: #3a2419; --b: #6f98ff; --b-soft: #1d2a45; --a0: #7d8390; --ok: #42c48a; --warn: #e2a64a; --bad: #ff6b60;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(26px, 4.4vw, 38px); line-height: 1.2; letter-spacing: -.01em; }
h2 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.head { padding: 34px 0 18px; display: grid; gap: 12px; }
.eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; color: var(--a); }
.sub { color: var(--muted); font-size: 14px; max-width: 78ch; }
.take { font-size: 16.5px; max-width: 76ch; line-height: 1.65; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); align-items: center; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.A { background: var(--a); } .dot.B { background: var(--b); }
.dot.Bp { background: var(--panel); border: 2px solid var(--b); } .dot.A0 { background: var(--panel); border: 2px dashed var(--a0); }
.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; margin: 0 -16px; padding: 6px 16px 0; }
.tab { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14.5px; padding: 9px 12px 11px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
.page { display: grid; gap: 18px; padding-top: 22px; }
.page[hidden] { display: none; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 10px; align-content: start; min-width: 0; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.hl { border-color: var(--a); }
.note { color: var(--muted); font-size: 13px; line-height: 1.55; }
.num { font-family: var(--serif); font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; font-weight: 500; }
.num.sm { font-size: 26px; }
.tnum { font-variant-numeric: tabular-nums; }
.secthead { display: grid; gap: 4px; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.kpi { display: grid; gap: 8px; }
.kpi .lab { font-size: 13.5px; color: var(--muted); }
.kpi .rows { display: grid; gap: 3px; font-size: 13px; }
.kpi .row { display: grid; grid-template-columns: 6.6rem 1fr 3.4rem; align-items: center; gap: 8px; color: var(--muted); }
.kpi .row b { color: var(--ink); font-weight: 600; text-align: right; }
.trk { position: relative; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.trk i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.trk i.A { background: var(--a); } .trk i.B { background: var(--b); } .trk i.Bp { background: var(--b); opacity: .45; } .trk i.A0 { background: var(--a0); }
.delta { font-size: 12.5px; color: var(--muted); }
.up { color: var(--ok); font-weight: 600; } .down { color: var(--bad); font-weight: 600; }
.finds { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.find h3 { font-size: 15.5px; line-height: 1.45; }
.find p { font-size: 14px; color: var(--muted); }
.find .n { font-size: 12px; font-weight: 700; color: var(--a); letter-spacing: .03em; }
.bars { display: grid; gap: 9px; }
.bar { display: grid; grid-template-columns: minmax(0, 12rem) minmax(0, 1fr) 3.6rem; gap: 10px; align-items: center; font-size: 13.5px; }
.bar .t { position: relative; height: 16px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.bar .t i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; }
.bar .lb { overflow-wrap: anywhere; }
@media (max-width: 560px) { .bar { grid-template-columns: 1fr 3.4rem; } .bar .lb { grid-column: 1 / -1; } }
svg { display: block; max-width: 100%; }
.chart { width: 100%; }
.chart text { fill: var(--muted); font-size: 11.5px; font-family: var(--sans); }
.chart .lbl { fill: var(--ink); font-size: 12.5px; }
.chart line.grid { stroke: var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--soft); }
tr.sel td { background: var(--a-soft); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.tbl table th { position: sticky; top: 0; background: var(--panel); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.A { background: var(--a-soft); color: var(--a); } .pill.B { background: var(--b-soft); color: var(--b); }
.list { margin: 0; padding-left: 1.15em; display: grid; gap: 7px; }
.list li { line-height: 1.55; }
.steps { display: grid; gap: 6px; }
.step { display: grid; grid-template-columns: minmax(0, 17rem) minmax(0, 1fr) 4.2rem 4rem; gap: 10px; align-items: center; font-size: 13.5px; padding: 4px 0; }
.step .t { position: relative; height: 18px; }
.step .t .base { position: absolute; top: 0; bottom: 0; background: var(--soft); border-radius: 4px; left: 0; right: 0; }
.step .t i { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; }
.step .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.step .d { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.step.ref { opacity: .7; }
.step.fin .lb { font-weight: 700; }
@media (max-width: 640px) { .step { grid-template-columns: 1fr 3.8rem 3.6rem; } .step .lb { grid-column: 1 / -1; } }
.stack { display: flex; height: 22px; border-radius: 5px; overflow: hidden; gap: 1px; background: var(--soft); }
.stack span { display: block; height: 100%; }
.lvrow { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr); gap: 4px 10px; align-items: center; font-size: 13px; }
.lvrow .s2 { grid-column: 2; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 12.5px; line-height: 1.45; padding: 7px 10px; border-radius: 8px; max-width: 280px; opacity: 0; transition: opacity .1s; }
.tip.on { opacity: 1; }
.det { display: grid; gap: 12px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type="search"], select { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.callout { border-left: 3px solid var(--a); padding: 4px 0 4px 12px; font-size: 14px; }
.callout.b { border-left-color: var(--b); }
.foot { color: var(--faint); font-size: 12.5px; padding-top: 28px; border-top: 1px solid var(--line); margin-top: 28px; display: grid; gap: 4px; }
.mini { font-size: 12.5px; color: var(--muted); }
.two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.two > *, .grid > *, .kpis > *, .finds > * { min-width: 0; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.sens { display: grid; gap: 10px; }
.srow { display: grid; grid-template-columns: minmax(0, 16rem) minmax(0, 1fr); gap: 4px 12px; align-items: center; font-size: 13px; }
@media (max-width: 640px) { .srow { grid-template-columns: 1fr; } }
.srow .t { position: relative; height: 16px; }
.srow .t .mid { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink); opacity: .6; }
.srow .t i { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; opacity: .85; }
.srow .vals { grid-column: 2; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .srow .vals { grid-column: 1; } }
.thm { position: absolute; top: 14px; right: 16px; }
.icon-btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
.rel { position: relative; }

/* ---- 추가: 처음 보는 사람용 구성 · 모바일/태블릿 폭 맞춤 ---- */
.how { gap: 8px; }
/* 요약 탭에서만 조건·결론을 크게 보이고, 다른 탭은 바로 본문으로 */

.how h2 { font-size: 15px; }
.list.plain { list-style: none; padding-left: 0; }
.list.plain li { padding-left: 18px; position: relative; }
.list.plain li > .dot:first-child { position: absolute; left: 0; top: .5em; }
.fnum { font-family: var(--serif); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink); }
.sh { font-size: 13.5px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
tr.dim td { color: var(--muted); }
details.card > summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::before { content: "▸"; color: var(--muted); }
details.card[open] > summary::before { content: "▾"; }
.kpis.inner { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.kpis.mini4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpis.mini4 .num.sm { font-size: 22px; }
.tbl.scroll { max-height: 640px; overflow: auto; }
.crewt td, .crewt th { padding: 7px 6px; }
.crewt td:first-child b { white-space: nowrap; }
.lvs { white-space: nowrap; }
.lvb { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; font-size: 11.5px; font-weight: 700; margin-right: 2px; font-variant-numeric: tabular-nums; }
.lvb.l1 { background: var(--bad); color: #fff; }
.lvb.l2 { background: #e9dccb; color: #5a4a35; }
.lvb.l3 { background: #cfe0d2; color: #2c4a35; }
.lvb.l4 { background: #5f9c79; color: #fff; }
.lvb.l5 { background: #2f6f50; color: #fff; }
td.ttl { font-weight: 600; }
.wrap { overflow-wrap: anywhere; word-break: keep-all; }
.num, .fnum, .tnum, td.r { word-break: normal; overflow-wrap: normal; }

/* 표 → 카드형 (휴대폰): 제목 한 줄 + 숫자는 2~3칸 격자 */
@media (max-width: 719px) {
  table.stk thead { display: none; }
  table.stk, table.stk tbody { display: block; width: 100%; }
  table.stk tr { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  table.stk tr:last-child { border-bottom: 0; }
  table.stk td { display: block; border: 0; padding: 0; text-align: left; min-width: 0; }
  table.stk td::before { content: attr(data-l); display: block; color: var(--muted); font-size: 11.5px; line-height: 1.3; font-weight: 400; margin-bottom: 1px; }
  table.stk td.r { font-size: 15px; font-weight: 600; }
  table.stk td:not(.r) { grid-column: 1 / -1; }
  table.stk td.ttl { font-size: 14.5px; }
  table.stk td.ttl::before { content: none; }
  .tbl:has(table.stk) { overflow: visible; }
}
/* 열이 많은 표는 세로 태블릿까지 카드형 */
@media (max-width: 899px) {
  table.stk-lg thead { display: none; }
  table.stk-lg, table.stk-lg tbody { display: block; width: 100%; }
  table.stk-lg tr { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  table.stk-lg tr:last-child { border-bottom: 0; }
  table.stk-lg td { display: block; border: 0; padding: 0; text-align: left; min-width: 0; }
  table.stk-lg td::before { content: attr(data-l); display: block; color: var(--muted); font-size: 11.5px; line-height: 1.3; font-weight: 400; margin-bottom: 1px; }
  table.stk-lg td.r { font-size: 15px; font-weight: 600; }
  table.stk-lg td:not(.r) { grid-column: 1 / -1; }
  table.stk-lg td.ttl { font-size: 14.5px; }
  table.stk-lg td.ttl::before { content: none; }
  .tbl:has(table.stk-lg) { overflow: visible; }
}
@media (max-width: 899px) {
  .two.crew { grid-template-columns: 1fr; }
}
/* 태블릿 */
@media (max-width: 1023px) {
  .step { grid-template-columns: minmax(0, 13rem) minmax(0, 1fr) 4rem 3.8rem; }
}
/* 휴대폰 */
@media (max-width: 719px) {
  html, body { font-size: 14.5px; }
  .wrap { padding: 0 14px 48px; }
  .head { padding: 44px 0 14px; gap: 10px; }
  .thm { top: 10px; right: 14px; }
  h1 { font-size: 24px; }
  .take { font-size: 15px; }
  .page { padding-top: 16px; gap: 14px; }
  .card { padding: 14px; border-radius: 12px; }
  .num { font-size: 28px; }
  .fnum { font-size: 26px; }
  .kpi .row { grid-template-columns: 7.4rem 1fr 3.3rem; gap: 6px; font-size: 12.5px; }
  .bar { grid-template-columns: 1fr 3.4rem; }
  .bar .lb { grid-column: 1 / -1; }
  .step { grid-template-columns: 1fr 3.8rem 4.4rem; gap: 2px 8px; padding: 2px 0; }
  .step .lb { grid-column: 1 / -1; }
  .step .d { white-space: nowrap; font-size: 12px; }
  .lvrow { grid-template-columns: 1fr; }
  .lvrow .s2 { grid-column: 1; }
  .kv { grid-template-columns: 1fr; gap: 0; }
  .kv dd { margin-bottom: 6px; }
  .crewt { font-size: 12.5px; }
  .crewt td:first-child .mini { font-size: 11.5px; line-height: 1.35; }
  .lvb { width: 18px; height: 18px; font-size: 11px; margin-right: 1px; }
  .tbl.scroll { max-height: 520px; }
  th { white-space: normal; }
}
@media (max-width: 380px) {
  .lvb { width: 16px; height: 17px; font-size: 10.5px; }
  .crewt td, .crewt th { padding: 6px 4px; }
}

/* ===== 보고서 형태 ===== */
:root { --shadow: none; }
.head { padding: 28px 0 16px; gap: 6px; border-bottom: 2px solid var(--ink); }
.doc { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.hdate { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.head h1 { font-size: clamp(24px, 3.6vw, 32px); margin-top: 2px; }
.head .sub { font-size: 14px; }
.caveat { font-size: 12.5px; color: var(--faint); }
.tabs { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: nowrap; gap: 0; overflow-x: auto; overflow-y: hidden; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 0 16px; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
.tabs::-webkit-scrollbar { display: none; }
.tabs .tab { flex: none; border: 0; border-radius: 0; background: none; color: var(--muted); font-size: 14px; padding: 11px 11px 10px; border-bottom: 2px solid transparent; }
.tabs .tab[aria-selected="true"] { background: none; color: var(--ink); font-weight: 700; border-bottom-color: var(--a); }
.card { box-shadow: none; }
.concl { margin-top: 4px; background: var(--soft); border-left: 3px solid var(--a); border-radius: 0 10px 10px 0; padding: 14px 16px; display: grid; gap: 6px; }
.concl h2 { font-size: 13px; color: var(--a); letter-spacing: .04em; }
.concl ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.concl li { font-size: 15px; line-height: 1.55; }
.rsec { display: grid; gap: 10px; }
h2.sec { display: flex; align-items: baseline; gap: 8px; font-size: 17px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
h2.sec span { font-size: 12px; font-weight: 700; color: var(--a); min-width: 1.2em; }
table.res { table-layout: fixed; font-size: 14px; }
table.res col.c0 { width: 43%; }
table.res th { white-space: normal; line-height: 1.3; vertical-align: bottom; }
table.res td { padding: 9px 8px; vertical-align: middle; }
table.res td.r { color: var(--muted); }
table.res .ca { background: var(--a-soft); }
table.res td.ca { color: var(--ink); }
table.res td.best { color: var(--ink); font-weight: 700; }
table.res tr:last-child td { border-bottom: 0; }
.lowb { color: var(--faint); font-size: 12px; }
ol.ins, ol.dec { margin: 0; padding: 0; list-style: none; counter-reset: n; display: grid; gap: 0; }
ol.ins li, ol.dec li { counter-increment: n; display: grid; grid-template-columns: 1.6em 1fr; gap: 2px 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
ol.ins li:last-child, ol.dec li:last-child { border-bottom: 0; }
ol.ins li::before, ol.dec li::before { content: counter(n); grid-row: span 2; font-size: 12.5px; font-weight: 700; color: var(--a); padding-top: 2px; }
ol.ins b, ol.dec b { font-size: 14.5px; }
ol.ins span, ol.dec span { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
ul.dots { margin: 0; padding-left: 1.1em; display: grid; gap: 5px; font-size: 14px; }
table.kvt th { width: 6.5em; color: var(--muted); font-weight: 600; white-space: nowrap; font-size: 13px; }
table.kvt td { font-size: 13.5px; }
